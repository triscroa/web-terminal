<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Terminal</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://js-dos.com/6.22/current/js-dos.css">
</head>
<body>
    <div id="terminal">
        <div id="output"></div>
        <div id="dosbox-container" style="display: none;">
            <button id="dosbox-close">Close DOOM</button>
            <canvas id="dosbox" width="640" height="400" tabindex="0"></canvas>
        </div>

        <div id="input-line">
            <span id="prompt">guest@terminal:~$</span>
            <input type="text" id="user-input" autofocus autocomplete="off" spellcheck="false">
        </div>
    </div>

    <script src="https://js-dos.com/6.22/current/js-dos.js"></script>
    <script src="script.js"></script>   
</body>
</html>
